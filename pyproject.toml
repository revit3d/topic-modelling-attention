[tool.poetry]
name = "cartm"
version = "0.1.0"
description = "Topic modelling with attention-based approach"
authors = ["Diyakov Ilya <s02210378@gse.cs.msu.ru>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
nltk = "^3.9.1"
scikit-learn = "^1.6.1"
numpy = "^2.2.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pandas = "^2.2.3"
seaborn = "^0.13.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
flake8 = "^7.1.1"
pylint = "^3.3.4"

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
jupyter = "^1.1.1"
ipykernel = "^6.29.5"
ipywidgets = "^8.1.8"
seaborn = "^0.13.2"

[tool.poetry.group.cpu]
optional = true

[tool.poetry.group.cpu.dependencies]
jax = "^0.10.0"

[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
jax = { extras = ["cuda13"], version = "^0.10.0" }

[tool.poetry.group.experiments]
optional = true

[tool.poetry.group.experiments.dependencies]
seaborn = "^0.13.2"
datasets = "^4.8.4"
bertopic = "^0.17.4"
sentence-transformers = "^5.4.1"
gensim = "^4.4.0"
bert-score = "^0.3.13"
bigartm = "^0.9.2"
bitermplus = "^0.10.0"
top2vec = {extras = ["sentence-transformers"], version = "^1.0.36"}
contextualized-topic-models = "^2.6.1"
protobuf = "3.20"

[tool.poetry.scripts]
download-nltk-data = "src.install:download_nltk_data"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
